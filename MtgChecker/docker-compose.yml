services:
  db:
    image: postgres:17-alpine
    container_name: mtgchecker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtgchecker}
      POSTGRES_USER: ${POSTGRES_USER:-mtgchecker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtgchecker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mtgchecker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtgchecker-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - mtgchecker_redisdata:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-mtgchecker_redis_secret_2026!} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-mtgchecker_redis_secret_2026!} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtgchecker-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mtgchecker}
      POSTGRES_USER: ${POSTGRES_USER:-mtgchecker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtgchecker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mtgchecker_redis_secret_2026!}
      DDL_AUTO: ${DDL_AUTO:-validate}
      APPLICATION_SERVER_URL: ${APPLICATION_SERVER_URL:-http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-MtgCheckerDevSecretKeyMustBeAtLeast32Chars!}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-1800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-2592000000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:80,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:80}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      LLM_PROVIDER: ${LLM_PROVIDER:-n8n}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      N8N_ENABLED: ${N8N_ENABLED:-true}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/mtg-judge}
      N8N_API_SECRET: ${N8N_API_SECRET:-}
    volumes:
      - ./tessdata:/app/tessdata:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mtgchecker-ollama
    ports:
      - "11434:11434"
    volumes:
      - mtgchecker_ollamadata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mtgchecker-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - mtgchecker_n8ndata:/home/node/.n8n
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mtgchecker-nginx
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  mtgchecker_pgdata:
  mtgchecker_redisdata:
  mtgchecker_n8ndata:
  mtgchecker_ollamadata:
