name: Local Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Local Docker
    runs-on: self-hosted

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 1.1 Setup .env file
        shell: powershell
        run: |
          if (Test-Path "E:\BE\MtgChecker\MtgChecker\.env") {
            Copy-Item "E:\BE\MtgChecker\MtgChecker\.env" -Destination "MtgChecker\.env" -Force
            Write-Host "Da copy file .env goc vao actions-runner thanh cong!"
          } else {
            Copy-Item "MtgChecker\.env.example" "MtgChecker\.env" -Force
            Write-Host "Tao .env tu .env.example!"
          }

      - name: 2. Build Backend JAR with Maven
        shell: powershell
        run: |
          Set-Location -Path "MtgChecker"
          Write-Host "Building MtgChecker JAR with Maven..."
          .\mvnw.cmd package -DskipTests

      - name: 3. Deploy Containers with Docker Compose
        shell: powershell
        run: |
          Set-Location -Path "MtgChecker"
          Write-Host "Starting Docker containers..."
          docker compose up --build -d

      - name: 4. Verify Running Services
        shell: powershell
        run: |
          Write-Host "Checking active Docker containers..."
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
