spring.application.name=MtgChecker
server.port=8080
server.error.include-message=always

# Local file database. Set POSTGRES_URL to use the PostgreSQL service instead.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/mtgchecker}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
scryfall.base-url=https://api.scryfall.com
scryfall.user-agent=MtgChecker/0.0.1 (personal card inventory)

application-title=MtgChecker API
application-description=Look up Magic card printings and track the cards you own.
application-version=0.0.1
application-server-url=${APPLICATION_SERVER_URL:http://localhost:8080}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:MtgCheckerDevSecretKeyMustBeAtLeast32Chars!}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:8082,http://127.0.0.1:8081,http://127.0.0.1:8082}


# n8n AI Distribution Gateway
n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/mtg-judge}
n8n.api-secret=${N8N_API_SECRET:tuilanguoidanongthep}
n8n.timeout-ms=${N8N_TIMEOUT_MS:60000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000
spring.cache.type=redis
